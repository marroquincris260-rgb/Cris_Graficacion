
<!-- MARCADOR 1: HIRO -->
<a-marker preset="hiro">

  <a-entity
    gltf-model="#miModelo"
    scale="0.5 0.5 0.5"
    position="0 0 0">
  </a-entity>

  <a-text
    value="Mi modelo 3D"
    align="center"
    color="#FFFFFF"
    position="0 1.5 0"
